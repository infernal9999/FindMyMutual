<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Find My Mutual...</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 56px;
      height: 56px;
      border: 5px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ea580c;
      border-right-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.95s cubic-bezier(0.5, 0.2, 0.2, 0.8) infinite;
    }
    p {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #cbd5e1;
      letter-spacing: 0.02em;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Connecting to Indian Railways Mutual Transfer Database...</p>
</body>
</html>
