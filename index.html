<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Mutual</title>
    <link rel="icon" href="https://lh3.googleusercontent.com/pw/AP1GczMWlRbfr7sGBIGgRTK1bd9orG2ki8o-b16aEWOLolwnVMgdCl-0nJ8nTOmsEcaZ7a1utNHV0lqBfCircAf5pGjUdi0qOjj6wzKxvrSe55ZQ2I3CxXLxrgdZ4EIvQTIvG-p8gAIf7kUkMLr08H11Jf0=w918-h918-s-no?authuser=0" type="image/png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
    <script>
    window.addEventListener("load", () => {
        const iframe = document.querySelector("iframe");
        if (iframe) {
            const isMobile = window.innerWidth <= 768;
            iframe.contentWindow.postMessage({ isMobile }, "*");
        }
    });
</script>
</head>
<body>
    <iframe id="loginIframe" src="https://script.google.com/macros/s/AKfycbxtCUj7ZcFq0YdXxkPyuMpsGlxmMngK3CxgiW9kLpRo7ByaPI03_wetC5njLpZU4jr8/exec" allowfullscreen></iframe>
</body>
</html>
